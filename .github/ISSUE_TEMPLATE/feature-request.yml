name: 功能建议
description: 建议新功能或对现有功能的改进
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 建议的内容
      description: 希望新增或改进的功能
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 在什么情况下需要这个功能，要解决什么问题
      placeholder: 如：家人在手机上上传照片时，希望能自动按拍摄日期放进对应的文件夹
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 目前的做法（选填）
      description: 现在是怎么处理的，有没有临时的办法

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（选填）
      description: 参考的产品、截图或其他说明
